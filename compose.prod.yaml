# Blacksmith production stack - rootless Podman or Docker.
#
#   podman compose -f compose.prod.yaml --env-file .env up -d
#   docker compose -f compose.prod.yaml --env-file .env up -d
#
# Layout:
#   edge      public-facing network, only the proxy sits on it
#   internal  application network, no published ports
#
# Copy contrib/proxy/prod.env.example to .env and fill it in.

name: blacksmith

networks:
  edge:
  internal:
    internal: false

volumes:
  blacksmith-data:
  postgres-data:
  crowdsec-config:
  crowdsec-data:
  caddy-data:
  caddy-logs:
  valkey-data:
  crow-data:
  crow-agent-data:

services:

  # Default edge proxy: Caddy + Coraza + CrowdSec bouncer.
  # Enable with --profile caddy. For Traefik instead, use
  # compose.traefik.yaml with --profile traefik.
  proxy:
    profiles:
      - caddy
    build:
      context: .
      dockerfile: contrib/proxy/Dockerfile
    image: blacksmith-proxy:latest
    restart: unless-stopped
    depends_on:
      - blacksmith
      - crowdsec
    environment:
      BLACKSMITH_DOMAIN: ${BLACKSMITH_DOMAIN:-localhost}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - caddy-data:/data
      - caddy-logs:/var/log/caddy
    networks:
      - edge
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  blacksmith:
    build: .
    image: blacksmith:latest
    restart: unless-stopped
    user: "65532:65532"
    environment:
      USER: git
      DOMAIN: ${BLACKSMITH_DOMAIN:-localhost}
      SSH_DOMAIN: ${SSH_DOMAIN:-${BLACKSMITH_DOMAIN:-localhost}}
      ROOT_URL: ${ROOT_URL:-https://${BLACKSMITH_DOMAIN:-localhost}/}
      BLACKSMITH__database__DB_TYPE: ${DB_TYPE:-sqlite3}
      BLACKSMITH__database__HOST: ${DB_HOST:-}
      BLACKSMITH__database__NAME: ${DB_NAME:-blacksmith}
      BLACKSMITH__database__USER: ${DB_USER:-blacksmith}
      BLACKSMITH__database__PASSWD: ${DB_PASSWD:-}
      BLACKSMITH__service__DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      BLACKSMITH__security__INSTALL_LOCK: ${INSTALL_LOCK:-true}
      BLACKSMITH__server__SSH_PORT: "22"
      BLACKSMITH__server__SSH_LISTEN_PORT: "2222"
      BLACKSMITH__server__START_SSH_SERVER: "true"
      # valkey-backed cache, sessions and queues
      BLACKSMITH__cache__ADAPTER: redis
      BLACKSMITH__cache__HOST: redis://valkey:6379/0?CACHE=pool
      BLACKSMITH__session__PROVIDER: redis
      BLACKSMITH__session__PROVIDER_CONFIG: redis://valkey:6379/1?CACHE=pool
      BLACKSMITH__queue__TYPE: redis
      BLACKSMITH__queue__CONN_STR: redis://valkey:6379/2?CACHE=pool
      # actions on local storage
      BLACKSMITH__actions__ENABLED: "true"
      BLACKSMITH__storage.actions__STORAGE_TYPE: local
      BLACKSMITH__storage.actions__PATH: /var/lib/blacksmith/data/actions
      # cap captcha (trycap.dev) for registration and login
      BLACKSMITH__service__ENABLE_CAPTCHA: ${ENABLE_CAPTCHA:-false}
      BLACKSMITH__service__CAPTCHA_TYPE: ${CAPTCHA_TYPE:-cap}
      BLACKSMITH__service__CAP_URL: ${CAP_URL:-}
      BLACKSMITH__service__CAP_SITEKEY: ${CAP_SITEKEY:-}
      BLACKSMITH__service__CAP_SECRET: ${CAP_SECRET:-}
    ports:
      # Built-in SSH only accepts authorized keys (no anonymous
      # access). Bound to localhost by default; set SSH_BIND=0.0.0.0
      # to expose it publicly.
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT:-2222}:2222"
    volumes:
      - blacksmith-data:/var/lib/blacksmith
    tmpfs:
      - /tmp/blacksmith:uid=65532,gid=65532
    networks:
      - internal
    labels:
      io.containers.autoupdate: registry
      wud.watch: "true"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: cgr.dev/chainguard/postgres:latest
    restart: unless-stopped
    profiles:
      - db
    environment:
      POSTGRES_DB: ${DB_NAME:-blacksmith}
      POSTGRES_USER: ${DB_USER:-blacksmith}
      POSTGRES_PASSWORD: ${DB_PASSWD:?set DB_PASSWD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      COLLECTIONS: >-
        crowdsecurity/caddy
        crowdsecurity/linux
        crowdsecurity/base-http-scenarios
        crowdsecurity/http-crawl-non_statics
        crowdsecurity/http-probing
        crowdsecurity/http-sensitive-files
        crowdsecurity/http-backdoors-attempts
        crowdsecurity/http-bad-user-agent
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
        crowdsecurity/appsec-crs
      BOUNCER_KEY_blacksmith: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY}
      DISABLE_LOCAL_API: "false"
    volumes:
      - ./contrib/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./contrib/crowdsec/appsec-rules:/etc/crowdsec/appsec-rules:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - caddy-logs:/var/log/caddy:ro
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: contrib/backup/Dockerfile
    image: blacksmith-backup:latest
    restart: unless-stopped
    profiles:
      - backup
    user: "65532:65532"
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD}
      RESTIC_COMPRESSION: ${RESTIC_COMPRESSION:-max}
      RESTIC_FORGET_ARGS: ${RESTIC_FORGET_ARGS:---keep-daily 7 --keep-weekly 4 --keep-monthly 6}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      DB_TYPE: ${DB_TYPE:-sqlite3}
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-blacksmith}
      DB_USER: ${DB_USER:-blacksmith}
      DB_PASSWD: ${DB_PASSWD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - blacksmith-data:/data/blacksmith:ro
      - postgres-data:/data/postgres:ro
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      io.containers.autoupdate: registry

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "300"
      - "100"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --loglevel
      - warning
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkey-data:/data
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Self-hosted Cap (trycap.dev) proof-of-work captcha. Optional;
  # point CAP_URL at it (e.g. https://cap.example.com/) after
  # creating a site key in its dashboard.
  cap:
    image: docker.io/tiago2/cap:latest
    restart: unless-stopped
    profiles:
      - captcha
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?set CAP_ADMIN_KEY}
      REDIS_URL: redis://valkey:6379/3
    depends_on:
      - valkey
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Crow CI server + agent. Blacksmith side: create an OAuth2 app
  # named Blacksmith CI (Settings -> Applications) with redirect
  # ${CROW_HOST}/authorize, then set CROW_FORGEJO_CLIENT and
  # CROW_FORGEJO_SECRET in .env. Crow logs in with forge accounts
  # and receives repo webhooks automatically. CROW_HOST must be
  # the public CI URL and ROOT_URL the public forge URL so the
  # authorize redirect never shows localhost.
  crow-server:
    image: ghcr.io/quad4-software/blacksmith-ci-server:latest
    restart: unless-stopped
    profiles:
      - crow
    ports:
      - "${CROW_BIND:-127.0.0.1}:${CROW_PORT:-8000}:8000"
    volumes:
      - crow-data:/var/lib/crow
    environment:
      CROW_OPEN: "false"
      CROW_HOST: ${CROW_HOST:?set CROW_HOST, e.g. https://ci.quad4.io}
      CROW_AGENT_SECRET: ${CROW_AGENT_SECRET:?set CROW_AGENT_SECRET}
      CROW_FORGEJO: "true"
      CROW_FORGEJO_URL: ${ROOT_URL:-https://${BLACKSMITH_DOMAIN:-localhost}/}
      CROW_FORGEJO_CLIENT: ${CROW_FORGEJO_CLIENT:?set CROW_FORGEJO_CLIENT}
      CROW_FORGEJO_SECRET: ${CROW_FORGEJO_SECRET:?set CROW_FORGEJO_SECRET}
      CROW_FORGEJO_SKIP_VERIFY: ${CROW_FORGEJO_SKIP_VERIFY:-false}
    depends_on:
      - blacksmith
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  crow-agent:
    image: ghcr.io/quad4-software/blacksmith-ci-agent:latest
    restart: unless-stopped
    profiles:
      - crow
    volumes:
      - ${CONTAINER_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock
      - crow-agent-data:/etc/crow
    environment:
      CROW_SERVER: crow-server:9000
      CROW_AGENT_SECRET: ${CROW_AGENT_SECRET:?set CROW_AGENT_SECRET}
      CROW_BACKEND: docker
      CROW_MAX_WORKFLOWS: ${CROW_MAX_WORKFLOWS:-4}
      CROW_HOSTNAME: ${CROW_AGENT_HOSTNAME:-blacksmith-crow-agent-1}
    depends_on:
      - crow-server
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # What's Up Docker: watches for new image tags, pulls them and
  # recreates watched containers via the docker trigger. Works
  # against the rootless podman socket. For quadlet deployments use
  # podman auto-update instead (see contrib/quadlets/).
  updater:
    image: docker.io/getwud/wud:9.6.0
    restart: unless-stopped
    profiles:
      - updater
    environment:
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_CRON: ${UPDATE_CRON:-0 3 * * *}
      WUD_TRIGGER_DOCKER_LOCAL_AUTO: "true"
      WUD_TRIGGER_DOCKER_LOCAL_PRUNE: "true"
      WUD_LOG_LEVEL: ${WUD_LOG_LEVEL:-info}
    volumes:
      # Point at the rootless podman socket, or leave default for docker.
      - ${CONTAINER_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro
    networks:
      - internal
    labels:
      wud.watch: "false"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
