# Skip body inspection for smart-HTTP git endpoints only.
# Match the normalized path (not the query string) so CRS
# cannot break clone/push while the rest of the WAF stays on.
SecRule REQUEST_FILENAME "@rx ^/[^/]+/[^/]+\.git/(info/refs|git-upload-pack|git-receive-pack)$" \
    "id:900001,phase:1,pass,nolog,t:none,t:normalizePath,ctl:ruleEngine=Off"
