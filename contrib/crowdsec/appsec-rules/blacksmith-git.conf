# Skip all WAF inspection for smart-HTTP git endpoints.
# URLs like /owner/repo.git/info/refs, /git-upload-pack and
# /git-receive-pack carry binary pack data and large POST
# bodies that trip the CRS. Git auth is enforced by the app
# itself, so bypassing the WAF here is safe.
SecRule REQUEST_URI "@rx /[^/]+/[^/]+\.git(/|$)" \
    "id:900001,phase:1,pass,nolog,ctl:ruleEngine=Off"
